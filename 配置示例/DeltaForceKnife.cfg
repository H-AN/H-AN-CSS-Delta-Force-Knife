// ============================================================
// DeltaForceKnife 三角洲风格刀具通用驱动配置
// 每把刀 = 一个组, 组名随意(建议用武器短名), 只有填写进组的武器会被驱动
// 修改配置后换图生效, 或用 sm_deltaforce_knife_reload 立即重载
// ============================================================
// ClassName              武器实体名称
// IdleTimeout            连续攻击间隔超过此时间后, 左键连招重新从第一刀开始
//
// LeftSequence1~3        左键三刀的 QC 动画序列号
// LeftFrames1~3          左键三刀的动画总帧数(传给武器系统, 动画持续时长 = 帧数/30 秒, 不参与音效计算)
// LeftFps1~3             左键三刀动画的 fps, 转刀音效帧号换算用(不填默认 66)
// LeftInterval1          左键 第三刀 -> 第一刀 的攻击间隔
// LeftInterval2          左键 第一刀 -> 第二刀 的攻击间隔
// LeftInterval3          左键 第二刀 -> 第三刀 的攻击间隔
// LeftDamage1~3          左键三刀基础伤害
//
// RightSequence          右键 QC 动画序列号, 逗号分隔: 填1个=固定动画, 填多个=按顺序交替循环(如 "8,6")
// RightFrames            右键动画总帧数(传给武器系统, 不参与音效计算)
// RightFps               右键动画 fps(不填默认 66)
// RightInterval          右键 -> 下一次右键 的攻击间隔
// RightDamage            右键基础伤害
//
// HeadshotMultiplier     爆头伤害倍率
// BotDamageMultiplier    (可选)对bot的额外伤害倍率, 留空或填 0 = 不启用
//                        填正数时: 不分爆头/非爆头, 在所有伤害计算完毕后再乘此倍率, 仅对bot生效(打玩家不受影响)
//
// RotateSound1~3         左键各刀转刀音效, 支持逗号分隔多条, 每条格式 "帧号:路径" = 动画第N帧开始播放
//                        (不带帧号 = 第0帧立即播放, 留空 = 不播放)
//                        例: "5:weapons/xx/a.wav,33:weapons/xx/b.wav" = 第5帧播a, 第33帧播b, 同通道顺序播放后者打断前者
// RightRotateSound       右键转刀音效, 格式同 RotateSound1~3, 同样支持逗号分隔多条
//
// DrawSequence2          特殊切换的 QC 序列号(填了才启用双切换动画: 50 播此序列, 50 走原版同步 draw)
// DrawFrames2            特殊切换动画总帧数(状态时长 = 帧数/30, 必须覆盖整个切换动画)
// DrawSound1             普通切换音效(走同步 draw 时播放, 留空 = 不播放)
// DrawSound2             特殊切换音效(走特殊 draw 时播放, 留空 = 不播放)
// 注意: 启用双切换时, 该武器在武器系统配置内的 switchsound 必须留空, 否则会叠加播放固定切换音效
// HitSound               普通命中音效(留空 = 不播放)
// KillSound              普通击杀音效(留空 = 不播放)
// HeadshotSound          爆头击杀音效(留空 = 不播放)
//
// 注意: 组内不填的键会使用北极星默认值(左键 4/5/6, 右键 8,6 交替)
// ============================================================

