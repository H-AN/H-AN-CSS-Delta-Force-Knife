        "IdleTimeout"            "2.0"
        // 左键三刀 QC 序列号
        "LeftSequence1"          "4"
        "LeftSequence2"          "5"
        "LeftSequence3"          "6"
        // 左键三刀动画总帧数(只管动画时长, 不参与音效)
        "LeftFrames1"            "90"
        "LeftFrames2"            "131"
        "LeftFrames3"            "165"
        // 左键三刀动画 fps(转刀音效帧号换算, 北极星66fps可省略)
        "LeftFps1"              "66"
        "LeftFps2"              "66"
        "LeftFps3"              "66"
        // 左键攻击间隔
        "LeftInterval1"          "0.6"    // 第三刀 -> 第一刀
        "LeftInterval2"          "0.3"    // 第一刀 -> 第二刀
        "LeftInterval3"          "0.4"    // 第二刀 -> 第三刀
        // 左键伤害
        "LeftDamage1"            "30.0"    // 第一刀
        "LeftDamage2"            "30.0"    // 第二刀
        "LeftDamage3"            "42.0"    // 第三刀
        // 右键: 先 8 后 6 交替(只填一个则为固定动画)
        "RightSequence"          "8,6"
        "RightFrames"            "61"
        // "RightFps"              "66"
        "RightInterval"          "0.6"
        "RightDamage"            "60.0"
        // 爆头伤害倍率
        "HeadshotMultiplier"     "2.0"
        // (可选)对bot额外伤害倍率: 留空或 0 = 不启用, 填正数则所有伤害算完后再乘(仅对bot, 不分部位)
        "BotDamageMultiplier"    "2.0"
        // 转刀音效: "帧号:路径" = 动画第N帧开始播放
        "RotateSound1"           "28:weapons/beijixing/beijixing_rotate_1.wav"
        "RotateSound2"           "55:weapons/beijixing/beijixing_rotate_2.wav"
        "RotateSound3"           "61:weapons/beijixing/beijixing_rotate_3.wav"
        "RightRotateSound"       "61:weapons/beijixing/beijixing_rotate_3.wav"
        // 命中/击杀音效
        "HitSound"               "weapons/beijixing/hit.wav"
        "KillSound"              "weapons/beijixing/kill.wav"
        "HeadshotSound"          "weapons/beijixing/headshot.wav"
    }

