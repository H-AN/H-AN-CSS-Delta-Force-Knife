// ============================================================
// DeltaForceKnife 三角洲风格刀具通用驱动配置
// 每把刀 = 一个组, 组名随意(建议用武器短名), 只有填写进组的武器会被驱动
// 修改配置后换图生效, 或用 sm_deltaforce_knife_reload 立即重载
// ============================================================
// ClassName              武器实体名称
// IdleTimeout            连续攻击间隔超过此时间后, 左键连招重新从第一刀开始
//
// LeftSequence1~3        左键三刀的 QC 动画序列号
// LeftFrames1~3          左键三刀的动画总帧数(传给武器系统, 动画持续时长 = 帧数/30 秒, 不参与音效计算)
// LeftFps1~3             左键三刀动画的 fps, 转刀音效帧号换算用(不填默认 66)
// LeftInterval1          左键 第三刀 -> 第一刀 的攻击间隔
// LeftInterval2          左键 第一刀 -> 第二刀 的攻击间隔
// LeftInterval3          左键 第二刀 -> 第三刀 的攻击间隔
// LeftDamage1~3          左键三刀基础伤害
//
// RightSequence          右键 QC 动画序列号, 逗号分隔: 填1个=固定动画, 填多个=按顺序交替循环(如 "8,6")
// RightFrames            右键动画总帧数(传给武器系统, 不参与音效计算)
// RightFps               右键动画 fps(不填默认 66)
// RightInterval          右键 -> 下一次右键 的攻击间隔
// RightDamage            右键基础伤害
//
// HeadshotMultiplier     爆头伤害倍率
// BotDamageMultiplier    (可选)对bot的额外伤害倍率, 留空或填 0 = 不启用
//                        填正数时: 不分爆头/非爆头, 在所有伤害计算完毕后再乘此倍率, 仅对bot生效(打玩家不受影响)
//
// RotateSound1~3         左键各刀转刀音效, 格式 "帧号:路径" = 动画第N帧开始播放(不带帧号 = 第0帧立即播放, 留空 = 不播放)
// RightRotateSound       右键转刀音效, 格式同 RotateSound1~3
//
// DrawSequence2          特殊切换的 QC 序列号(填了才启用双切换动画: 50 播此序列, 50 走原版同步 draw)
// DrawFrames2            特殊切换动画总帧数(状态时长 = 帧数/30, 必须覆盖整个切换动画)
// DrawSound1             普通切换音效(走同步 draw 时播放, 留空 = 不播放)
// DrawSound2             特殊切换音效(走特殊 draw 时播放, 留空 = 不播放)
// 注意: 启用双切换时, 该武器在武器系统配置内的 switchsound 必须留空, 否则会叠加播放固定切换音效
// HitSound               普通命中音效(留空 = 不播放)
// KillSound              普通击杀音效(留空 = 不播放)
// HeadshotSound          爆头击杀音效(留空 = 不播放)
//
// 注意: 组内不填的键会使用北极星默认值(左键 4/5/6, 右键 8,6 交替)
// ============================================================

"DeltaForceKnife"
{
    // ==================== 北极星 ====================
    "beijixing2"
    {
        // 武器实体名称
        "ClassName"              "weapon_beijixing2"
        // 连招空闲超时
        "IdleTimeout"            "2.0"
        // 左键三刀 QC 序列号
        "LeftSequence1"          "5"
        "LeftSequence2"          "6"
        "LeftSequence3"          "4" 
        // 左键三刀动画总帧数(只管动画时长, 不参与音效)
        "LeftFrames1"            "120"
        "LeftFrames2"            "132"
        "LeftFrames3"            "163"
        // 左键三刀动画 fps(转刀音效帧号换算, 北极星66fps可省略)
        "LeftFps1"              "62"
        "LeftFps2"              "65"
        "LeftFps3"              "68"
        // 左键攻击间隔
        "LeftInterval1"          "0.8"    // 第三刀 -> 第一刀
        "LeftInterval2"          "0.5"    // 第一刀 -> 第二刀
        "LeftInterval3"          "0.6"    // 第二刀 -> 第三刀
        // 左键伤害
        "LeftDamage1"            "30.0"    // 第一刀
        "LeftDamage2"            "30.0"    // 第二刀
        "LeftDamage3"            "42.0"    // 第三刀
        // 右键: 先 8 后 6 交替(只填一个则为固定动画)
        "RightSequence"          "4,7"
        "RightFrames"            "163"
        // "RightFps"              "66"
        "RightInterval"          "0.6"
        "RightDamage"            "60.0"
        // 爆头伤害倍率
        "HeadshotMultiplier"     "2.0"
        // (可选)对bot额外伤害倍率: 留空或 0 = 不启用, 填正数则所有伤害算完后再乘(仅对bot, 不分部位)
        "BotDamageMultiplier"    "2.0"
        // 转刀音效: "帧号:路径" = 动画第N帧开始播放
        "RotateSound1"           "0:weapons/polaris/polaris_attack1.wav,32:weapons/polaris/polaris_rotate_1.wav"
        "RotateSound2"           "0:weapons/polaris/polaris_attack2.wav,54:weapons/polaris/polaris_rotate_2.wav"
        "RotateSound3"           "0:weapons/polaris/polaris_attack3.wav,61:weapons/polaris/polaris_rotate_3.wav"
        "RightRotateSound"       "0:weapons/polaris/polaris_attack3.wav,61:weapons/polaris/polaris_rotate_3.wav"
        // 命中/击杀音效
        "HitSound"               "weapons/polaris/hit.wav"
        "KillSound"              "weapons/polaris/kill.wav"
        "HeadshotSound"          "weapons/polaris/headshot.wav"

        // 特殊切换的 QC 序列号: 50% 概率播这个, 50% 走原版同步 draw
        "DrawSequence2"          "8"      
        // 特殊切换动画总帧数(HLMV 查看, 状态时长 = 帧数/30, 必须覆盖整个 draw)
        "DrawFrames2"            "64"
        // 特殊切换音效(走特殊 draw 时播放)
        "DrawSound2"             "weapons/polaris/polaris_deploy2.wav"   // ← 路径按你的实际文件填
    }

    "xintiao2"
    {
        // 武器实体名称
        "ClassName"              "weapon_xintiao2"
            // 连招空闲超时
        "IdleTimeout"            "2.0"
        // 左键三刀 QC 序列号
        "LeftSequence1"          "5"
        "LeftSequence2"          "6"
        "LeftSequence3"          "7"
        // 左键三刀动画总帧数(只管动画时长, 不参与音效)
        "LeftFrames1"            "103"
        "LeftFrames2"            "115"
        "LeftFrames3"            "131"
        // 左键三刀动画 fps
        "LeftFps1"               "60"
        "LeftFps2"               "70"
        "LeftFps3"               "70"
        // 左键攻击间隔
        "LeftInterval1"          "0.6"    // 第三刀 -> 第一刀
        "LeftInterval2"          "0.5"    // 第一刀 -> 第二刀
        "LeftInterval3"          "0.5"    // 第二刀 -> 第三刀
        // 左键伤害
        "LeftDamage1"            "25.0"    // 第一刀
        "LeftDamage2"            "25.0"    // 第二刀
        "LeftDamage3"            "25.0"    // 第三刀
        // 右键: 先 8 后 6 交替(只填一个则为固定动画)
        "RightSequence"          "4,7"
        "RightFrames"            "131"
        "RightFps"               "70"
        "RightInterval"          "0.6"
        "RightDamage"            "50.0"
        // 爆头伤害倍率
        "HeadshotMultiplier"     "2.6"
        // (可选)对bot额外伤害倍率: 留空或 0 = 不启用, 填正数则所有伤害算完后再乘(仅对bot, 不分部位)
        "BotDamageMultiplier"    "2.0"
        // 转刀音效: "帧号:路径" = 动画第N帧开始播放
        "RotateSound1"           "0:weapons/Adage/Adage_attack1.wav,32:weapons/Adage/Adage_rotate_1.wav"
        "RotateSound2"           "0:weapons/Adage/Adage_attack2.wav,54:weapons/Adage/Adage_rotate_2.wav"
        "RotateSound3"           "0:weapons/Adage/Adage_attack3.wav,61:weapons/Adage/Adage_rotate_3.wav"
        "RightRotateSound"       "0:weapons/Adage/Adage_attack3.wav,61:weapons/Adage/Adage_rotate_3.wav"
        // 命中/击杀音效
        "HitSound"               "weapons/Adage/hit.wav"
        "KillSound"              "weapons/Adage/kill.wav"
        "HeadshotSound"          "weapons/Adage/headshot.wav"

        // 特殊切换的 QC 序列号: 50% 概率播这个, 50% 走原版同步 draw
        "DrawSequence2"          "8"      // ← 填你重塑 QC 里第二个 draw 的序列号
        // 特殊切换动画总帧数(HLMV 查看, 状态时长 = 帧数/30, 必须覆盖整个 draw)
        "DrawFrames2"            "94"
        // 特殊切换音效(走特殊 draw 时播放)
        "DrawSound2"             "weapons/Adage/adage_deploy2.wav"   // ← 路径按你的实际文件填
    }

    // ==================== 新刀具模板(复制一份去掉注释使用) ====================
