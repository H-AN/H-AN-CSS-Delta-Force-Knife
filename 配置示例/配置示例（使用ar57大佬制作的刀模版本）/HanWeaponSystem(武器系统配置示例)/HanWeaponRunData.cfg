// HanWeaponSystem 武器奔跑配置文件
// 此文件与 HanWeaponData.cfg 自动同步：主配置新增武器时会自动追加一个默认键组
// 默认全部关闭奔跑，需要奔跑的武器再填写参数
// 字段说明：
// useclassname   对应主配置的武器 useclassname(自动复制)
// run            1=启用奔跑 0=关闭
// runspeed       奔跑启动推力(每帧面向方向叠加的速度增量, 默认 50); 缺省/0=不加力
// runmaxspeed    奔跑总体速度上限(默认走路约250, 500≈2倍速, 达到后保持不再加力)
// runseq         奔跑动作1动画序列号(动作2自动=+1)
// runtime        奔跑动作时长(帧, 30fps)
// runin          可选 Idle->奔跑过渡动作序列号
// runinlength    可选 Idle->奔跑过渡时长(帧)
// runout         可选 奔跑->Idle过渡动作序列号
// runoutlength   可选 奔跑->Idle过渡时长(帧)
// runshake       抖动幅度值; 0/缺省=不抖动, >0 按该值抖动
// runseq_silencer/runtime_silencer/runin_silencer/runinlength_silencer/runout_silencer/runoutlength_silencer: 消音器变体(仅变体武器 m4a1/usp); 装上消音器时生效, 不填回落普通字段
"HanWeaponSystem"
{

   "weapon_beijixing2"
    {
        "useclassname"    "weapon_beijixing2"
        "run"             "1"
        // 奔跑参数(仅 run 1 时生效):
        "runspeed"        "50.0"
        "runmaxspeed"     "500.0"
        "runseq"          "10"
        "runtime"         "64"
        "runin"           "12"
        "runinlength"     "8"
        "runout"          "13"
        "runoutlength"    "19"
        "runshake"        "0.8"
    }
    "weapon_xintiao2"
    {
        "useclassname"    "weapon_xintiao2"
        "run"             "1"
        // 奔跑参数(仅 run 1 时生效):
        "runspeed"        "50.0"
        "runmaxspeed"     "500.0"
        "runseq"          "10"
        "runtime"         "64"
        "runin"           "12"
        "runinlength"     "12"
        "runout"          "13"
        "runoutlength"    "10"
        "runshake"        "0.8"
    }
}
